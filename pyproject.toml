[project]
name = "vlogkit"
version = "0.15.0"
description = "Vlog kurgu araç setimiz: analiz, altyazı/grafik, ses ve Shorts/uzun video export'u (ffmpeg + Pillow)."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
    "typer>=0.12",
]

[project.scripts]
vlogkit = "vlogkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long ffmpeg filter strings are clearer unwrapped
    "RUF001",  # Turkish text / typographic characters in captions are intentional
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg-full installed (skipped otherwise)"]
